services:
  workspace:
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - ..:/workspaces/smartfind:cached
      - maven-cache:/root/.m2
    working_dir: /workspaces/smartfind
    command: sleep infinity
    environment:
      DB_URL: jdbc:mysql://db:3306/smartfind?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: smartfind
      DB_PASSWORD: classroom_dev_only
      PORT: '8080'
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smartfind
      MYSQL_USER: smartfind
      MYSQL_PASSWORD: classroom_dev_only
      MYSQL_ROOT_PASSWORD: local_root_dev_only
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 25
volumes:
  mysql-data:
  maven-cache:
